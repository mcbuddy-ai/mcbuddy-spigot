# =============================================================================
# Конфигурация MCBuddy Spigot Plugin
# 💬 Интеллектуальный AI-ассистент для Minecraft сервера
# =============================================================================

# Настройки подключения к серверу MCBuddy
# URL бэкенд-сервера, который обрабатывает запросы к AI-ассистенту
server:
  url: "https://mcbuddy.ru"

# Параметры HTTP-клиента для взаимодействия с сервером
# Настройка таймаутов и других параметров для оптимальной производительности
http:
  # Основные таймауты (в секундах)
  call_timeout: 300        # Общий таймаут для всего запроса (5 минут для очередей)
  connect_timeout: 10      # Время ожидания установки соединения
  read_timeout: 300        # Время ожидания чтения ответа от сервера (5 минут)
  write_timeout: 10        # Время ожидания отправки данных на сервер
  tool_timeout: 10         # Сколько секунд инструмент может работать на сервере, прежде чем ассистент получит ошибку

  # Настройки соединений и производительности
  max_idle_connections: 5  # Максимальное количество idle соединений в пуле
  keep_alive_duration: 300 # Время жизни idle соединения (в секундах)
  max_requests_per_host: 5 # Максимальное количество одновременных запросов к одному хосту

  # Настройки редиректов и повторных попыток
  follow_redirects: true   # Следовать по HTTP редиректам (301, 302, etc.)
  retry_on_connection_failure: true # Повторять запрос при сбое соединения

  # Настройки логирования
  logging: false # Включить логирование запросов и ответов (без body, только код и url)

  # Настройки сжатия и заголовков
  compression_enabled: true # Включить сжатие gzip/deflate для запросов/ответов
  user_agent: "MCBuddy-Spigot/2.1.0 (Minecraft Plugin)" # User-Agent заголовок

  # Дополнительные заголовки для всех запросов
  custom_headers:
    "X-Plugin-Version": "2.1.0"
    "X-Platform": "Spigot"
    # "X-OpenRouter-Token": "sk-or-v1-1234567890"

# Настройки пользовательского интерфейса и взаимодействия
ui:
  # Живой статус в Action Bar (над хотбаром), как у Claude Code:
  # «✻ Обдумываю… (12с · ↑ 2.4k · ↓ 340 токенов)» — спиннер, меняющийся глагол, время,
  # сколько токенов модель прочитала (↑) и сколько написала (↓)
  action_bar:
    enabled: true                              # Показывать статус в action bar
    # Плейсхолдеры: {spinner}, {verb}, {elapsed}, {input}, {output}
    format: "&6{spinner} &6{verb}… &7({elapsed} · ↑ {input} · ↓ {output})"
    answering: "Пишу ответ"                    # Глагол, пока ассистент пишет ответ
    spinner: "·✢✳✶✻✽"                          # Кадры спиннера; он проходит их туда и обратно
    frame_millis: 120                          # Длительность одного кадра спиннера (в мс)
    verb_seconds: 3                            # Как часто меняется глагол (в секундах)
    verbs:                                     # Глаголы для /ask
      - "Обдумываю"
      - "Прикидываю"
      - "Вспоминаю рецепты"
      - "Сверяюсь с вики"
      - "Копаю глубже"
      - "Колдую"
      - "Размышляю"
      - "Соображаю"
    askx_verbs:                                # Глаголы для /askx
      - "Подбираю команды"
      - "Сверяю синтаксис"
      - "Собираю команду"
      - "Прикидываю"

  # Строки в чате, когда ассистент пользуется инструментами:
  # «⏺ Заглядываю в инвентарь» и под ней «⎿ 12 стаков»
  tool_lines:
    enabled: true
    started: "&7⏺ {label}"
    finished: "&8  ⎿ {summary}"
    failed: "&c  ⎿ {summary}"
    # Свои подписи для инструментов; {аргумент} подставляется из вызова
    labels: {}
    #  get_inventory: "Роюсь в карманах"
    #  search_web: "Гуглю «{query}»"

  particles:
    enabled: true                              # Показывать частицы вокруг головы игрока
    type: "ENCHANT"                            # Тип частиц (ENCHANTMENT_TABLE, VILLAGER_HAPPY, etc.)
    count: 3                                   # Количество частиц за раз
    height_offset: 2.0                         # Высота над головой игрока
    animation_interval: 250                    # Интервал между появлением частиц (в мс)

  chat_status:
    enabled: false                             # Показывать статус в чате (thinking сообщения)

  # Звуковые эффекты
  sounds:
    enabled: true                              # Включить звуки

    # Звук при получении успешного ответа
    success_sound: "ENTITY_EXPERIENCE_ORB_PICKUP"
    success_volume: 0.5
    success_pitch: 1.2

    # Звук при ошибке
    error_sound: "AMBIENT_CAVE"                # Пещерный страшный звук
    error_volume: 0.6
    error_pitch: 0.7

    # Звук при начале обработки запроса
    thinking_sound: "BLOCK_NOTE_BLOCK_CHIME"
    thinking_volume: 0.3
    thinking_pitch: 1.0

# Настройка текстовых сообщений для игроков
# Все сообщения поддерживают Minecraft цветовые коды (&a, &c, &f и т.д.)
messages:
  # Общие сообщения команды /ask
  thinking: "&eОбращаюсь к AI-ассистенту, подождите немного..."
  usage: "&7Использование: &f/ask <вопрос>\n&7Пример: &f/ask как скрафтить алмазную кирку?\n&7Остановить: &f/ask cancel&7, начать заново: &f/ask new&7, память: &f/ask memory"
  error: "&cНе удалось получить ответ от AI-ассистента."

  # Сообщения команды /askx
  askx_thinking: "&eАнализирую ваш запрос и генерирую команды..."
  askx_usage: "&7Использование: &f/askx <описание действия>\n&7Пример: &f/askx дай мне алмазный меч с остротой 5"
  askx_error: "&cНе удалось выполнить команды. Попробуйте переформулировать запрос или обратитесь к администратору."

  # Сообщения выполнения команд
  commands_executing: "&aВыполняю {count} команд{sequence}..."
  command_executed: "&aВыполнено: /{command}"
  no_commands_to_execute: "&eНет команд для выполнения"
  blocked_command: "&cЭта команда заблокирована для выполнения через /askx из соображений безопасности."
  command_failed: "&cОшибка: /{command}"
  command_execution_error: "&cОшибка выполнения: /{command}"

  # Сообщения команды /ask cancel
  cancelled: "&7Остановил."
  nothing_to_cancel: "&7Сейчас я ничего не делаю."

  # Напоминание, которое ассистент поставил игроку; {text} — о чём напомнить
  reminder: "&e⏰ Напоминание: &f{text}"

  # Разговор и память. Ассистент помнит последние вопросы сутки, а важное об игроке
  # (где база, какие цели) — пока игрок не попросит забыть
  session_cleared: "&aНачинаем разговор заново. Что я о тебе помню, осталось: &f/ask memory"
  memory_header: "&6Что я о тебе помню:"
  memory_line: "&e{n}. &f{text}"
  memory_footer: "&7Забыть: &f/ask forget <номер|all>"
  memory_empty: "&7Я пока ничего о тебе не запомнил. Скажи «запомни, что…», и запомню."
  forgot: "&aЗабыл: &f{text}"
  forgot_all: "&aЗабыл всё, что помнил о тебе ({count})."
  forget_usage: "&7Использование: &f/ask forget <номер|all>&7. Номера — в &f/ask memory"
  forget_not_found: "&cНет записи с номером {n}. Список: &f/ask memory"
  memory_unsupported: "&cСервер MCBuddy пока не умеет хранить память."

  # Сообщения команды /reload
  reload_success: "&aКонфигурация MCBuddy успешно перезагружена!"
  reload_error: "&cОшибка при перезагрузке конфигурации: {error}"

# Настройки сообщений об ошибках
error_messages:
  # API ошибки (коды от сервера)
  api_errors:
    # Пользовательские ошибки (400-499)
    EMPTY_QUESTION: "&cВопрос не может быть пустым"
    QUESTION_TOO_LONG: "&cВопрос слишком длинный (максимум 1000 символов)"
    EMPTY_ACTION: "&cОписание действия не может быть пустым"
    ACTION_TOO_LONG: "&cОписание действия слишком длинное (максимум 500 символов)"
    TOO_MANY_COMMANDS: "&cСлишком много команд для выполнения (максимум 12)"
    AI_ERROR: "&cAI не смог обработать ваш запрос. Попробуйте переформулировать."
    BAD_REQUEST: "&cНекорректный запрос. Попробуйте еще раз."
    METHOD_NOT_SUPPORTED: "&cМетод не поддерживается"
    
    # Серверные ошибки (500+)
    AI_REQUEST_FAILED: "&cAI-сервис временно недоступен. Попробуйте позже."
    NO_AI_RESPONSE: "&cAI не ответил на запрос. Попробуйте позже."
    NETWORK_ERROR: "&cПроблемы с сетью. Проверьте подключение к интернету."
    REDIS_ERROR: "&cПроблемы с базой данных. Попробуйте позже."
    QUEUE_ERROR: "&cСервер перегружен. Попробуйте через несколько минут."
    PROCESSING_ERROR: "&cОшибка обработки запроса. Попробуйте позже."
    PARSE_ERROR: "&cОшибка обработки ответа AI. Попробуйте позже."
    INVALID_FORMAT: "&cНекорректный формат ответа AI. Попробуйте позже."
  
  # HTTP статус коды
  http_errors:
    400: "&cНекорректный запрос. Попробуйте переформулировать."
    401: "&cОшибка авторизации. Обратитесь к администратору."
    403: "&cДоступ запрещен."
    404: "&cСервис не найден. Обратитесь к администратору."
    429: "&cПревышен лимит запросов. Подождите немного и попробуйте снова."
    500: "&cВнутренняя ошибка сервера. Попробуйте позже."
    502: "&cСервер временно недоступен. Попробуйте позже."
    503: "&cСервис временно недоступен. Попробуйте позже."
    504: "&cТаймаут запроса. Сервер перегружен, попробуйте позже."
  
  # Исключения и системные ошибки
  system_errors:
    timeout: "&cЗапрос занял слишком много времени. AI-сервер перегружен, попробуйте позже."
    network: "&cПроблемы с подключением к серверу. Проверьте интернет-соединение."
    default: "&cПроизошла неожиданная ошибка. Попробуйте позже."

# Инструменты: ассистент сам спрашивает плагин об игре, когда ему это нужно.
# Все инструменты знают только о том игроке, который спросил, и о мире вокруг него;
# другие игроки видны лишь как число рядом. Выключенный инструмент ассистент не получит.
tools:
  enabled:
    get_player_status: true   # Здоровье, голод, опыт, координаты, биом, эффекты, предмет в руке
    get_inventory: true       # Инвентарь, броня, вторая рука и, по запросу, эндер-сундук
    get_surroundings: true    # Блоки и существа вокруг (руды, сундуки, спавнеры, мобы)
    get_target: true          # Блок или существо в перекрестье
    get_world: true           # Время, день, луна, погода, сложность, важные правила игры
    get_statistics: true      # Наигранное время, смерти, убийства, расстояния
    get_advancements: true    # Полученные и ближайшие достижения
    get_recipes: true         # Рецепты именно этого сервера
    locate_structure: true    # Ближайшая деревня, крепость и т. п. (поиск нагружает сервер)
    get_server: true          # Версия сервера, сложность, число игроков онлайн
    get_locations: true       # Точка возрождения, спавн мира и место последней смерти
    get_villager_trades: true # Сделки жителя или странствующего торговца в перекрестье
    get_container: true       # Содержимое сундука, бочки или шалкера в перекрестье
    scan_nearby_containers: true # Контейнеры вокруг и где лежит нужный предмет (видит сквозь стены — выключите, если у игроков есть приваты)
    get_block_info: true      # Прочность блока, чем копать, что выпадет, стадия роста
    get_map_info: true        # Карта в руке: масштаб, центр, внутри ли игрок
    get_enchant_options: true # Стол зачарований: сколько полок работает, какой уровень доступен
    get_mob_info: true        # Моб в перекрестье: здоровье, броня, сколько ударов нужно
    get_light_spawn_check: true # Где вокруг темно и могут появиться враждебные мобы
    get_brewing_items: true   # Всё для зельеварения в инвентаре и варочные стойки рядом
    scan_farm: true           # Ферма вокруг: посевы по стадиям, грядки, животные, спавнеры
    # Блокнот игрока: заметки с координатами, хранятся в plugins/mcbuddy-spigot/notes
    add_note: true            # Записать заметку (по умолчанию — там, где стоит игрок)
    find_notes: true          # Найти заметки, ближайшие первыми
    delete_note: true         # Удалить заметку
    # Безобидные действия: ничего не выдают и не меняют мир
    point_to: true            # Направить компас игрока на точку и показать путь частицами (видит только он)
    sort_inventory: true      # Сложить стаки и упорядочить инвентарь (хотбар не трогается)
    set_reminder: true        # Напомнить игроку о чём-то через 1–120 минут
    get_reminders: true       # Показать напоминания игрока, ближайшие первыми
    cancel_reminder: true     # Отменить одно напоминание или все
  # Инструменты, которые меняют игру для спросившего: выдают предметы, телепортируют и т. п.
  # Ассистент получает их, только если игрок — оператор; плагин проверяет это ещё раз перед запуском.
  # Обычный игрок не уговорит ассистента выдать ему меч.
  operator:
    enabled: true             # Выключите, чтобы ассистент ничего не менял даже для операторов
    give_item: true           # Выдать предмет (до 576 штук, с зачарованиями)
    teleport: true            # Телепортировать к точке или к игроку онлайн
    set_gamemode: true        # Сменить режим игры
    heal: true                # Восстановить здоровье и сытость, потушить огонь
    apply_effect: true        # Наложить эффект (до часа, уровень до 10) или снять все
    set_time: true            # Сменить время суток в мире игрока
    set_weather: true         # Сменить погоду в мире игрока
  # Напоминания живут в памяти сервера: рестарт или выход игрока их сбрасывают
  reminders:
    max_pending: 10           # Сколько напоминаний может ждать у одного игрока
  notes:
    max_per_player: 200       # Сколько заметок может быть в блокноте одного игрока
  # Радиус поиска структур в чанках; поиск идёт в основном потоке, поэтому не делайте его большим
  locate_structure_radius: 64

# Настройки разрешений для команд плагина
# При default_permission: true команды доступны всем игрокам по умолчанию
permissions:
  default_permission: true  # Разрешить использование команд всем игрокам

# Список команд, запрещенных для выполнения через /askx
# Эти команды могут нарушить работу сервера или безопасность
# Отсортированы в алфавитном порядке для удобства поиска
blocked_commands:
  - "ban"           # Блокировка игроков
  - "config"        # Изменение конфигурации
  - "configure"     # Настройка сервера
  - "deop"          # Снятие прав оператора
  - "kick"          # Исключение игроков
  - "op"            # Выдача прав оператора
  - "pardon"        # Разблокировка игроков
  - "pl"            # Список плагинов
  - "plugin"        # Управление плагинами
  - "plugins"       # Список плагинов
  - "reload"        # Перезагрузка плагинов/сервера
  - "restart"       # Перезапуск сервера
  - "save-all"      # Принудительное сохранение мира
  - "save-off"      # Отключение автосохранения
  - "save-on"       # Включение автосохранения
  - "stop"          # Остановка сервера
  - "whitelist"     # Управление белым списком