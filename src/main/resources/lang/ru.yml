# Разговор и память. Ассистент помнит последние вопросы сутки, а важное об игроке
# (где база, какие цели) — пока игрок не попросит забыть.
memory:
  session_cleared: "&aНачинаем разговор заново. Что я о тебе помню, осталось: &f/buddy memory"
  header: "&6Что я о тебе помню:"
  line: "&e{n}. &f{text}"
  footer: "&7Забыть: &f/buddy forget <номер|all>"
  empty: "&7Я пока ничего о тебе не запомнил. Скажи «запомни, что…», и запомню."
  forgot: "&aЗабыл: &f{text}"
  forgot_all: "&aЗабыл всё, что помнил о тебе ({count})."
  forget_usage: "&7Использование: &f/buddy forget <номер|all>&7. Номера — в &f/buddy memory"
  not_found: "&cНет записи с номером {n}. Список: &f/buddy memory"
  unsupported: "&cСервер MCBuddy пока не умеет хранить память."

# Режим чата: всё, что игрок пишет в чат, уходит MCBuddy. ! — команды, ? — вопрос при всех,
# ~ — сообщение в общий чат. Подсказка о режиме появляется под вторым /ask за заход.
chat_mode:
  echo: "&8› &7{text}"
  enabled: "&a✔ Режим чата включён. &7Теперь всё, что ты пишешь в чат, уходит мне, а не другим игрокам."
  prefix_askx: "&f  ! &7в начале — выполнить команды, как /askx"
  prefix_public: "&f  ? &7в начале — спросить так, чтобы видели все"
  prefix_chat: "&f  ~ &7в начале — написать в общий чат"
  how_to_off: "&7Выключить: &f/buddy chat off"
  disabled: "&7Режим чата выключен: чат снова для всех. Спросить меня можно через &f/ask&7."
  reminder: "&8※ Режим чата включён: пиши мне прямо в чат. &7~&8 в начале — в общий чат, &7/buddy chat off&8 — выключить."
  no_askx: "&cКоманды через ! тебе недоступны."
  no_askall: "&cСпрашивать при всех тебе нельзя."
  hints_off: "&7Хорошо, больше не предлагаю. Режим чата включается командой &f/buddy chat&7."
  hints_on: "&7Подсказка о режиме чата снова включена."
  tip: "&8※ Можно писать мне прямо в чат, без /ask."
  tip_enable: "&7[Режим чата]"
  tip_enable_hover: "&7Включить режим чата: всё, что ты пишешь в чат, уйдёт мне"
  tip_hide: "&8[Не показывать]"
  tip_hide_hover: "&7Больше не предлагать режим чата"

# Вопросы при всех (/askall, ? в режиме чата): вопрос и ответ видят все игроки онлайн.
public:
