  unsupported: "&cDieser MCBuddy-Server kann sich noch nichts merken."

# Chatmodus: Was ein Spieler in den Chat schreibt, geht an MCBuddy. ! führt Befehle aus, ? fragt vor allen,
# ~ schreibt in den normalen Chat. Der Tipp dazu erscheint unter dem zweiten /ask pro Besuch.
chat_mode:
  echo: "&8› &7{text}"
  enabled: "&a✔ Der Chatmodus ist an. &7Alles, was du in den Chat schreibst, geht jetzt an mich statt an die anderen."
  prefix_askx: "&f  ! &7am Anfang führt Befehle aus, wie /askx"
  prefix_public: "&f  ? &7am Anfang fragt so, dass alle es sehen"
  prefix_chat: "&f  ~ &7am Anfang schreibt in den normalen Chat"
  how_to_off: "&7Ausschalten: &f/buddy chat off"
  disabled: "&7Der Chatmodus ist aus: Der Chat gehört wieder allen. Frag mich mit &f/ask&7."
  reminder: "&8※ Der Chatmodus ist an: Schreib mir direkt in den Chat. &7~&8 am Anfang geht in den normalen Chat, &7/buddy chat off&8 schaltet ihn aus."
  no_askx: "&cBefehle mit ! stehen dir nicht zur Verfügung."
  no_askall: "&cDu darfst nicht vor allen fragen."
  hints_off: "&7Alles klar, ich schlage es nicht mehr vor. Den Chatmodus schaltest du mit &f/buddy chat&7 ein."
  hints_on: "&7Der Tipp zum Chatmodus ist wieder an."
  tip: "&8※ Du kannst mir direkt in den Chat schreiben, ohne /ask."
  tip_enable: "&7[Chatmodus]"
  tip_enable_hover: "&7Chatmodus einschalten: Alles, was du in den Chat schreibst, geht an mich"
  tip_hide: "&8[Nicht mehr zeigen]"
  tip_hide_hover: "&7Den Chatmodus nicht mehr vorschlagen"

# Fragen vor allen (/askall, ? im Chatmodus): Alle Spieler online lesen Frage und Antwort.
