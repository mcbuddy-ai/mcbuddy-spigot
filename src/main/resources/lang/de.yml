# MCBuddy-Texte auf Deutsch. Jeder Spieler liest die Datei seiner Sprache; fehlt hier ein
# Schlüssel, nimmt das Plugin ihn aus locales.default und dann aus dem Englischen. Ein leerer
# Text ("") schaltet eine Nachricht ab. Farben sind &-Codes (&a, &7, &f…). Platzhalter sehen
# aus wie {name}, Mehrzahl wie {count|Stapel|Stapel}: Die Zahl in {count} wählt die Form.

status:
  # Die Live-Zeile über der Schnellleiste, während der Assistent arbeitet, wie bei Claude Code:
  # Spinner, wechselndes Verb, Sekunden, gelesene (↑) und geschriebene (↓) Token.
  line: "&6{spinner} &6{verb}… &7({seconds}s · ↑ {input} · ↓ {output} {tokens|Token|Tokens})"
  answering: "Schreibe die Antwort"
  verbs:
    - "Blättere im Rezeptbuch"
    - "Schmelze Gedanken im Ofen"
    - "Verzaubere die Antwort"
    - "Braue einen Trank der Weisheit"
    - "Frage den Bibliothekar"
    - "Schaue auf die Karte"
    - "Verlege Redstone"
    - "Setze Verstärker"
    - "Lege Kohle nach"
    - "Schärfe die Spitzhacke"
    - "Grabe auf Y −59"
    - "Stelle Fackeln auf"
    - "Durchwühle Truhen"
    - "Werfe ein Enderauge"
    - "Entzünde das Portal"
    - "Schleiche am Wärter vorbei"
    - "Streite mit einem Creeper"
    - "Schere Schafe"
  askx_verbs:
    - "Richte einen Befehlsblock ein"
    - "Wähle den Selektor @s"
    - "Prüfe die Syntax"
    - "Drehe am Komparator"

tool_lines:
  # Eine Zeile im Chat, wenn der Assistent ein Werkzeug nutzt, und das Ergebnis darunter.
  started: "&7⏺ {label}"
  finished: "&8  ⎿ {summary}"
  # Den Grund ({reason}) schreibt das Plugin für den Assistenten auf Englisch, darum fehlt er hier.
  failed: "&c  ⎿ hat nicht geklappt"
  unknown: "Nutze {name}"

