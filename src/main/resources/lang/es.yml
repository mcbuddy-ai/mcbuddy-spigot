# La conversación y la memoria. El asistente recuerda las preguntas recientes durante un día, y los
# datos duraderos del jugador (su base, sus objetivos) hasta que el jugador le pida olvidarlos.
memory:
  session_cleared: "&aEmpezamos de nuevo. Lo que recuerdo de ti sigue ahí: &f/buddy memory"
  header: "&6Lo que recuerdo de ti:"
  line: "&e{n}. &f{text}"
  footer: "&7Para olvidar: &f/buddy forget <número|all>"
  empty: "&7Todavía no recuerdo nada de ti. Dime “recuerda que…” y lo haré."
  forgot: "&aOlvidado: &f{text}"
  forgot_all: "&aHe olvidado todo lo que recordaba de ti ({count})."
  forget_usage: "&7Uso: &f/buddy forget <número|all>&7. Los números están en &f/buddy memory"
  not_found: "&cNo hay ninguna entrada con el número {n}. La lista: &f/buddy memory"
  unsupported: "&cEste servidor de MCBuddy aún no puede guardar recuerdos."

# Modo chat: lo que el jugador escribe en el chat va a MCBuddy. ! ejecuta comandos, ? pregunta delante de
# todos, ~ escribe en el chat normal. El consejo aparece bajo el segundo /ask de cada visita.
chat_mode:
  echo: "&8› &7{text}"
  enabled: "&a✔ Modo chat activado. &7Ahora todo lo que escribas en el chat me llega a mí, no a los demás jugadores."
  prefix_askx: "&f  ! &7al principio ejecuta comandos, como /askx"
  prefix_public: "&f  ? &7al principio pregunta para que todos lo vean"
  prefix_chat: "&f  ~ &7al principio escribe en el chat normal"
  how_to_off: "&7Para desactivarlo: &f/buddy chat off"
  disabled: "&7Modo chat desactivado: el chat vuelve a ser de todos. Pregúntame con &f/ask&7."
  reminder: "&8※ El modo chat está activado: escríbeme directamente en el chat. &7~&8 al principio va al chat normal, &7/buddy chat off&8 lo desactiva."
  no_askx: "&cLos comandos con ! no están disponibles para ti."
  no_askall: "&cNo puedes preguntar delante de todos."
  hints_off: "&7Vale, no te lo vuelvo a sugerir. El modo chat se activa con &f/buddy chat&7."
  hints_on: "&7El consejo sobre el modo chat vuelve a estar activado."
  tip: "&8※ Puedes escribirme directamente en el chat, sin /ask."
  tip_enable: "&7[Modo chat]"
  tip_enable_hover: "&7Activar el modo chat: todo lo que escribas en el chat me llegará a mí"
  tip_hide: "&8[No mostrar más]"
  tip_hide_hover: "&7Dejar de sugerir el modo chat"

# Preguntas delante de todos (/askall, ? en modo chat): todos los jugadores en línea leen la pregunta y la respuesta.
public:
  question: "&5✦ &d{player} &7pregunta a MCBuddy:&f {text}"
  answer: "&5✦ &dMCBuddy &8»&r {text}"
  failed: "&8✦ MCBuddy no pudo responder esta vez."
  cooldown: "&7Podrás preguntar a todos otra vez en {seconds} {seconds|segundo|segundos}."

# Botones bajo las respuestas. Solo puede pulsarlos el jugador que los recibió; dejan de funcionar al cabo de una hora.
buttons:
  format: "&a[{label}]"
  read_book: "Abrir el libro"
  take_book: "Coger el libro"
  hover:
    ask: "&7Preguntar: &f{question}"
    point: "&7Mostrar el camino a &f{x} {y} {z}"
    note: "&7Apuntar en la libreta: &f{text} &7({x} {y} {z})"
    recipe: "&7Abrir la receta"
    enchants: "&7Abrir los encantamientos del objeto en la mano"
    villagers: "&7Abrir los aldeanos cercanos"
    read_book: "&7Abrir el libro “{title}”"
    take_book: "&7Guardar el libro “{title}” en tu inventario"
  expired: "&7Este botón ya no funciona. Vuelve a preguntar."
  question: "&7› {question}"
  path_shown: "&7Mostrando el camino: &f{distance} &7bloques al {direction}."
  other_dimension: "&7Este sitio está en otra dimensión."
  note_saved: "&aApuntado en la libreta: &f{text}"
  book_taken: "&aEl libro está en tu inventario."
  book_gone: "&7Este libro ya no existe. Vuelve a pedir la respuesta detallada."

