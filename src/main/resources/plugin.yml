name: mcbuddy-spigot
version: '${version}'
description: 'An AI buddy in chat: /ask about the game, with answers grounded in your inventory, surroundings, and this server, in each player''s language.'
main: ru.mcbuddy.spigot.Zygote
api-version: '26.3'
author: MairwunNx
website: https://mcbuddy.ru
prefix: mcbuddy
load: STARTUP
plugin-name: McBuddy

commands:
  ask:
    description: Ask the MCBuddy AI assistant
    usage: /<command> <question> | cancel | new | memory | forget <number|all> | recipe <item> | enchants | villagers
    permission: mcbuddy.ask
  askx:
    description: Turn a request into Minecraft commands
    usage: /<command> <what to do>
    permission: mcbuddy.askx

permissions:
  mcbuddy.ask:
    description: Ask questions with /ask
    default: true
  mcbuddy.askx:
    description: Run commands with /askx
    default: op
  mcbuddy.reload:
    description: Reload settings and languages with /ask reload
    default: op
